{% with cur=request.resolver_match.url_name %}
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-name">活動相簿</div>
        <div class="sidebar-brand-sub">Management</div>
    </div>
    <nav class="sidebar-nav">
        <a class="nav-item {% if cur == 'staff-dashboard' %}active{% endif %}"
           href="{% url 'staff-dashboard' %}">總覽</a>
        <a class="nav-item {% if cur == 'event-create' or cur == 'event-update' %}active{% endif %}"
           href="{% url 'event-create' %}">新增活動</a>
        <a class="nav-item {% if cur == 'member-manage' %}active{% endif %}"
           href="{% url 'member-manage' %}">人員管理</a>
        <a class="nav-item" href="{% url 'event-list' %}" target="_blank">瀏覽網站 ↗</a>
    </nav>
    <div class="sidebar-user">
        <span class="user-avatar">{{ request.user.username|first|upper }}</span>
        <span class="sidebar-user-name">{{ request.user.username }}</span>
        <form method="post" action="/admin/logout/" style="display:inline">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            <button type="submit" class="logout-link">登出</button>
        </form>
    </div>
</aside>
{% endwith %}

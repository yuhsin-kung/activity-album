{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>刪除活動 | 後台管理</title>
    <link rel="stylesheet" href="{% static 'albums/manage.css' %}?v=2">
</head>
<body>
<div class="mgmt-layout">

    {% include 'albums/manage/_sidebar.html' %}

    <main class="mgmt-main">
        <div class="mgmt-header">
            <div class="mgmt-header-text">
                <p class="mgmt-eyebrow">Delete Event</p>
                <h1 class="mgmt-title">刪除活動</h1>
            </div>
        </div>
        <div class="form-card danger-card">
            <h2>確定要刪除「{{ object.title }}」？</h2>
            <p class="text-muted">此操作會一併刪除所有相關照片與附件，且無法復原。</p>
            <form method="post">
                {% csrf_token %}
                <div class="form-actions" style="justify-content:center">
                    <button class="btn-danger" type="submit">確認刪除</button>
                    <a class="btn-secondary" href="{% url 'staff-dashboard' %}">取消</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>

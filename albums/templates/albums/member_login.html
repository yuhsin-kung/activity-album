{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登入 | 資科系活動相簿</title>
    <link rel="stylesheet" href="{% static 'albums/style.css' %}?v=4">
</head>
<body>

{% include 'albums/_nav.html' %}

<div class="page-header">
    <p class="page-header-eyebrow">Member Login</p>
    <h1>登入</h1>
</div>

<div class="container">

    {% if messages %}
        {% for message in messages %}
            <div class="notice-message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% if form.errors %}
        <div class="form-error">帳號或密碼錯誤，請重新輸入。</div>
    {% endif %}

    <div class="form-panel">
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <p>
                <label for="id_username">帳號</label>
                {{ form.username }}
            </p>
            <p>
                <label for="id_password">密碼</label>
                {{ form.password }}
            </p>
            <div class="form-actions">
                <button type="submit">登入</button>
                <a class="secondary-link" href="{% url 'member-signup' %}">還沒有帳號？註冊</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
